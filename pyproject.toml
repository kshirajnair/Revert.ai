[project]
name = "revert"
version = "0.1.0"
description = "AI collections assistant for Indian manufacturers and distributors"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
